# SPDX-License-Identifier: GPL-3.0-or-later
# Compilation automatique de JSG Guitar par GitHub (gratuit pour un dépôt public) :
#   - Mac   : JSG Guitar.dmg (Mac Apple et Intel)
#   - Windows : JSG Guitar Setup.exe (logiciel + plug-in VST3)
#   - Linux : vérification des parties communes (version de test)
# Les fichiers produits sont dans l'onglet « Actions » (rubrique Artifacts) de chaque compilation.
# Avec une étiquette v0.1.0, v0.2.0… ils sont aussi joints à une « Release » (et signés par SignPath une fois
# le projet accepté : secret SIGNPATH_API_TOKEN, variable SIGNPATH_ORGANIZATION_ID, voir .signpath/LISEZMOI.md).
#
# Signature Apple (facultative) : secrets du dépôt (Settings > Secrets and variables > Actions)
#   MACOS_CERTIFICATE           certificat « Developer ID Application » exporté en .p12, encodé en base64
#   MACOS_CERTIFICATE_PASSWORD  mot de passe du .p12
#   MACOS_SIGN_IDENTITY         ex. « Developer ID Application: Jérôme Soler (ABCDE12345) »
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   pour la notarisation (mot de passe d'application Apple)
name: Compilation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: Mac (.dmg)
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Certificat Apple (si configuré)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        if: env.HAS_CERT == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/jsg.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p jsg "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p jsg "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k jsg "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Compilation et image disque
        env:
          JSG_MAC_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./installateur/creer_dmg_mac.sh

      - uses: actions/upload-artifact@v7
        with:
          name: JSG-Guitar-Mac
          path: installateur/sortie/JSG Guitar.dmg
          if-no-files-found: error

  windows:
    name: Windows (installateur)
    runs-on: windows-2022
    env:
      # Signature SignPath : seulement pour une Release (étiquette v…), quand le secret SIGNPATH_API_TOKEN existe
      SIGNER: ${{ secrets.SIGNPATH_API_TOKEN != '' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      # --- Sans signature : tout d'un coup -----------------------------------
      - name: Compilation (logiciel, plug-in VST3, installateur)
        if: env.SIGNER != 'true'
        shell: cmd
        run: installateur\tout_compiler.bat

      - name: Installateur (non signé)
        if: env.SIGNER != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: JSG-Guitar-Windows
          path: installateur/sortie/JSG Guitar Setup.exe
          if-no-files-found: error

      # --- Avec signature SignPath : logiciel et plug-in, puis installateur ---
      - name: Compilation (logiciel, plug-in VST3)
        if: env.SIGNER == 'true'
        shell: cmd
        env:
          JSG_ETAPE: fichiers
        run: installateur\tout_compiler.bat

      - name: Envoi du logiciel et du plug-in à signer
        if: env.SIGNER == 'true'
        id: binaires
        uses: actions/upload-artifact@v7
        with:
          name: a-signer-binaires
          path: |
            installateur/fichiers/app/JSG Guitar.exe
            installateur/fichiers/vst3/JSG Guitar.vst3/Contents/x86_64-win/JSG Guitar.vst3
          if-no-files-found: error

      - name: Signature du logiciel et du plug-in (SignPath)
        if: env.SIGNER == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'JSG-Guitar' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: binaires
          github-artifact-id: ${{ steps.binaires.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21600   # le temps d'approuver la signature sur SignPath
          output-artifact-directory: installateur/signes

      - name: Fichiers signés à la place des originaux
        if: env.SIGNER == 'true'
        shell: cmd
        run: |
          robocopy installateur\signes installateur\fichiers /E /NJH /NJS /NFL /NDL
          if %ERRORLEVEL% GEQ 8 exit /b 1
          exit /b 0

      - name: Installateur
        if: env.SIGNER == 'true'
        shell: cmd
        env:
          JSG_ETAPE: installateur
        run: installateur\tout_compiler.bat

      - name: Envoi de l'installateur à signer
        if: env.SIGNER == 'true'
        id: installateur
        uses: actions/upload-artifact@v7
        with:
          name: a-signer-installateur
          path: installateur/sortie/JSG Guitar Setup.exe
          if-no-files-found: error

      - name: Signature de l'installateur (SignPath)
        if: env.SIGNER == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'JSG-Guitar' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installateur
          github-artifact-id: ${{ steps.installateur.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21600
          output-artifact-directory: installateur/sortie-signee

      - name: Installateur (signé)
        if: env.SIGNER == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: JSG-Guitar-Windows
          path: installateur/sortie-signee/JSG Guitar Setup.exe
          if-no-files-found: error

  linux:
    name: Vérification (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compilation de la version de test
        run: |
          cmake -S sources -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
      - name: Le serveur sert l'interface
        run: |
          mkdir -p "$RUNNER_TEMP/travail"
          ./build/jsg_test ui "$RUNNER_TEMP/travail" &
          SERVEUR=$!
          sleep 2
          curl -fsS http://127.0.0.1:47811/index.html > /dev/null
          curl -fsS http://127.0.0.1:47811/js/app.js > /dev/null
          kill $SERVEUR

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ mac, windows ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: JSG-Guitar-*
          path: fichiers
      # Préversion : installateur Windows seulement. Le .dmg Mac sera ajouté quand il aura été essayé sur un Mac
      # (variable du dépôt JSG_PUBLIER_MAC = true pour l'inclure).
      - uses: softprops/action-gh-release@v3
        with:
          name: JSG Guitar ${{ github.ref_name }}
          prerelease: ${{ vars.JSG_PRERELEASE != 'false' }}
          body_path: installateur/NOTES-VERSION.md
          files: |
            fichiers/JSG-Guitar-Windows/JSG Guitar Setup.exe
            ${{ vars.JSG_PUBLIER_MAC == 'true' && 'fichiers/JSG-Guitar-Mac/JSG Guitar.dmg' || '' }}
